name: Temporary Loom Transcript

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/temp-loom-transcript.yml'

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Loom video stream
        shell: bash
        run: |
          set -u
          mkdir -p tmp_loom
          VIDEO_ID='a8af48aadec9445a9185a42504b195a6'
          API="https://www.loom.com/api/campaigns/sessions/${VIDEO_ID}/transcoded-url"
          echo 'FETCHING_STREAM' > tmp_loom/status.txt

          curl -sS -X POST "$API" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Mozilla/5.0' \
            -d '{}' > tmp_loom/transcoded_response.json || true

          python3 - <<'PY'
          import json,sys
          p='tmp_loom/transcoded_response.json'
          try:
              d=json.load(open(p,encoding='utf-8'))
              u=d.get('url')
              if not u:
                  raise RuntimeError('No URL in Loom response: '+json.dumps(d)[:1000])
              open('/tmp/loom_video_url.txt','w').write(u)
              open('tmp_loom/status.txt','w').write('STREAM_URL_OK\n')
          except Exception as e:
              open('tmp_loom/status.txt','w').write('STREAM_URL_ERROR\n'+repr(e)+'\n')
              sys.exit(2)
          PY

          VIDEO_URL="$(cat /tmp/loom_video_url.txt)"
          curl -sS -L -A 'Mozilla/5.0' --fail --retry 2 \
            -o /tmp/webinar.mp4 "$VIDEO_URL"

          ls -lh /tmp/webinar.mp4 | tee tmp_loom/video_size.txt
          ffmpeg -i /tmp/webinar.mp4 2> tmp_loom/ffmpeg_info.txt || true
          echo 'VIDEO_DOWNLOADED' > tmp_loom/status.txt

      - name: Install transcription tools
        shell: bash
        run: |
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q faster-whisper

      - name: Transcribe German audio
        shell: bash
        run: |
          echo 'TRANSCRIBING' > tmp_loom/status.txt
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          import os

          model = WhisperModel('base', device='cpu', compute_type='int8')
          segments, info = model.transcribe(
              '/tmp/webinar.mp4',
              language='de',
              beam_size=2,
              vad_filter=True,
              condition_on_previous_text=True
          )

          def ts(sec):
              sec=int(sec)
              return f'{sec//3600:02d}:{(sec%3600)//60:02d}:{sec%60:02d}'

          out='tmp_loom/webinar_transkript.txt'
          count=0
          with open(out,'w',encoding='utf-8') as f:
              f.write(f'# Sprache: {info.language}; Wahrscheinlichkeit: {info.language_probability:.3f}\n')
              for seg in segments:
                  text=seg.text.strip()
                  if not text:
                      continue
                  f.write(f'[{ts(seg.start)} - {ts(seg.end)}] {text}\n')
                  count += 1
          open('tmp_loom/status.txt','w').write(f'OK\nsegments={count}\n')
          print('segments',count)
          PY

      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name 'ChatGPT temporary job'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp_loom
          git commit -m 'Temporary Loom transcription result' || true
          git push
