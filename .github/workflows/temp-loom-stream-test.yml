name: Temporary Loom Metadata Probe

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/temp-loom-stream-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Loom metadata
        shell: bash
        run: |
          mkdir -p tmp_loom_test
          python3 - <<'PY'
          import json, urllib.request
          vid='a8af48aadec9445a9185a42504b195a6'
          query='''query GetVideo($videoId: ID!, $password: String) {
            getVideo(id: $videoId, password: $password) {
              ... on RegularUserVideo {
                __typename id name description playable_duration createdAt
                owner { display_name }
              }
              ... on PrivateVideo { __typename id }
            }
          }'''
          payload={'query':query,'variables':{'videoId':vid,'password':None}}
          req=urllib.request.Request('https://www.loom.com/graphql',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Mozilla/5.0'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read())
              open('tmp_loom_test/metadata.json','w',encoding='utf-8').write(json.dumps(data,indent=2,ensure_ascii=False))
              open('tmp_loom_test/metadata_status.txt','w').write('OK\n')
          except Exception as e:
              open('tmp_loom_test/metadata_status.txt','w').write('ERROR\n'+repr(e)+'\n')
          PY
          git config user.name 'ChatGPT temporary job'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp_loom_test
          git commit -m 'Temporary Loom metadata result' || true
          git push
